  (function () {
    if (window.__CPlusMusicInitialized) return;

    function savePrefs() {

      if (elCompact) elCompact.hidden = expanded;
      if (elExpanded) elExpanded.hidden = !expanded;
      if (!expanded && elDrawer) elDrawer.hidden = true;
      syncVisibility();
      emitChange('cplus:music-change');

    function updateUi() {

      dock.classList.toggle('is-playing', state.playing);

      if (state.track) {

        if (elCompactTitle) elCompactTitle.textContent = '音乐 · ' + tracks.length + ' 首';

        return;

      play((currentIndex + 1) % tracks.length);

        audio.currentTime = 0;
        return;

      if (prefs.mode === 'shuffle' && tracks.length > 1) {

        while (pick === currentIndex) {

      prefs.muted = audio.muted;
      savePrefs();
      updateUi();

    document.getElementById('dock-collapse-btn')?.addEventListener('click', () => {

        dismissed = true;

      setExpanded(false);

    document.getElementById('dock-dismiss-btn')?.addEventListener('click', () => {
      dismissed = true;
      expanded = false;
      if (elDrawer) elDrawer.hidden = true;
      syncVisibility();
      emitChange('cplus:music-change');

      if (elDrawer.hidden && !elQueue?.children.length) renderQueue();
      elDrawer.hidden = !elDrawer.hidden;

    elSeek?.addEventListener('pointerdown', () => { isSeeking = true; });
    elSeek?.addEventListener('input', (e) => {

      if (elCur) elCur.textContent = fmtTime(ratio * audio.duration);

    elSeek?.addEventListener('change', (e) => {

      seekToRatio(Number(e.target.value) / 1000);

      next: () => next(false),
      prev,
      cycleMode,
      setVolume,
      toggleMute,
      seekToRatio,
      setExpanded,
      toggleExpanded: () => {
        if (dock.hidden) {

        } else {

        }
      },
      getState,
      fmtTime,
    };
