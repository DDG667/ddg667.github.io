<!doctype html><meta charset="utf-8"><title>pending</title>
<style>
@font-face{font-family:'ZZW';src:url('/fonts/ZhuZiAWan.subset.woff2') format('woff2');font-display:block}
@font-face{font-family:'HK';src:url('/fonts/Hack-Bold.ttf') format('truetype')}
body{font-family:'ZZW';font-size:40px}
</style>
<div>测试字体 ZhuZiAWan ABC 123</div>
<script>
Promise.all([
  document.fonts.load('40px ZZW','测试字体'),
  document.fonts.load('40px HK','test')
]).then(function(r){ document.title = 'ZW=' + r[0].length + ' HK=' + r[1].length; });
setTimeout(function(){ if (document.title === 'pending') document.title = 'TIMEOUT'; }, 6000);
</script>
