      .then(function(data){

      .catch(function(){ playlist = []; return playlist; })
      .finally(function(){ loadingPromise = null; });
    return loadingPromise;
  }

  function play(i){
    if (!playlist.length) return;
    if (i < 0) i = 0;
    if (i >= playlist.length) i = playlist.length - 1;
    currentIndex = i;
    var a = ensureAudio();
    var src = '/res/audios/' + encodeURIComponent(playlist[i]);

    updateFloating();
    highlightPlaying();
    dispatchChange();
  }

  // Intercept nav clicks on the Music link so it opens the quick-select modal.

    prev: prev,
    parseName: parseName,
    getState: getState
  };
